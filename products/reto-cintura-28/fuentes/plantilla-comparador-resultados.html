<!-- Plantilla interna: no está publicada ni muestra un caso real.
     Insertar dentro de #r28-results-track SOLO después de recibir el par original,
     nombre, tiempo confirmado, versión del programa y autorización escrita.
     Sustituir TODOS los marcadores; exportar imágenes sin alterar cuerpo o proporciones.
     Si el caso es presencial u otro acompañamiento, ajustar también el contexto de la sección. -->
<figure class="r28-result-card" data-result-comp>
  <div class="r28-result-media">
    <button type="button" class="r28-result-compare" data-result-flip aria-label="Ver el después de NOMBRE" aria-pressed="false">
      <img src="assets/resultados/NOMBRE-antes.webp" alt="Antes de NOMBRE" loading="lazy">
      <img class="result-after" src="assets/resultados/NOMBRE-despues.webp" alt="Después de NOMBRE" loading="lazy" aria-hidden="true">
      <span class="r28-result-phase" data-result-phase aria-hidden="true">Antes</span>
      <span class="r28-result-hint" data-result-hint aria-hidden="true">Ver después</span>
    </button>
  </div>
  <figcaption><div class="r28-result-meta"><b>NOMBRE</b><span>TIEMPO CONFIRMADO</span></div><small>PROGRAMA CONFIRMADO</small></figcaption>
</figure>
